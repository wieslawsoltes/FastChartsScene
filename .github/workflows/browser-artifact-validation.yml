name: Validate built browser artifact
on:
  push:
    branches: [feat/uno-charting]
    paths:
      - '.github/workflows/browser-artifact-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: browser-site
          run-id: 38091601831
          github-token: ${{ github.token }}
          path: artifacts/site/FastChartsScene
      - name: Record tested application revision
        run: |
          mkdir -p artifacts/browser-results
          printf '%s\n' 'Application: d9f77f3c369d265b80154f88b7dbb93e8418d92b' 'Build run: 38091601831' > artifacts/browser-results/application-revision.txt
          printf 'Test harness: ' >> artifacts/browser-results/application-revision.txt
          git rev-parse HEAD >> artifacts/browser-results/application-revision.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        working-directory: tests/browser
        run: |
          npm install --ignore-scripts --no-audit --no-fund --no-package-lock
          npx playwright install --with-deps chromium
      - name: Test previously compiled application
        working-directory: tests/browser
        shell: bash
        run: node browser-tests.mjs 2>&1 | tee ../../artifacts/browser-results/test-output.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: built-browser-validation
          path: artifacts/browser-results
          if-no-files-found: error
