name: Validate Skia fallback artifact
on:
  push:
    branches: [feat/uno-charting]
    paths:
      - '.github/workflows/fallback-validation.yml'
      - 'tests/browser/fallback-tests.mjs'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  skia-2d:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: browser-site
          run-id: 38092434461
          github-token: ${{ github.token }}
          path: artifacts/site/FastChartsScene
      - name: Record application and harness revisions
        run: |
          mkdir -p artifacts/fallback-results
          printf '%s\n' 'Application branch commit: 070797a31a3b90fe9ae52317a8b9d408ab1ad89d' 'Application tree: 5a26a2e1345b555a3852f5e2bea61b08308ef8bd' 'Build run: 38092434461' 'Scope: Skia 2D only. No GPU validation claimed.' > artifacts/fallback-results/revisions.txt
          git rev-parse HEAD HEAD^{tree} >> artifacts/fallback-results/revisions.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        working-directory: tests/browser
        run: |
          npm install --ignore-scripts --no-audit --no-fund --no-package-lock
          npx playwright install --with-deps chromium
      - name: Validate explicit Skia presentation and interactions
        working-directory: tests/browser
        shell: bash
        run: node fallback-tests.mjs 2>&1 | tee ../../artifacts/fallback-results/test-output.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skia-fallback-validation
          path: artifacts/fallback-results
          if-no-files-found: error
