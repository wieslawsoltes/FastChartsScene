name: Validate
on:
  push:
    branches: [main, feat/uno-charting]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build and test portable packages
        run: |
          mkdir -p artifacts
          dotnet run --project tests/FastChartsScene.Tests -c Release | tee artifacts/core-tests.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-results
          path: artifacts/core-tests.txt
  uno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install WebAssembly workload
        run: dotnet workload install wasm-tools
      - name: Compile desktop target
        run: dotnet build samples/FastChartsScene.Explorer -c Release -f net10.0-desktop
      - name: Publish browser application
        run: dotnet publish samples/FastChartsScene.Explorer -c Release -f net10.0-browserwasm -o artifacts/publish
      - name: Locate browser bundle
        run: |
          set -euo pipefail
          index=$(find artifacts/publish -name index.html -not -path '*/_framework/*' | head -1)
          test -n "$index"
          mkdir -p artifacts/site/FastChartsScene
          cp -a "$(dirname "$index")/." artifacts/site/FastChartsScene/
          touch artifacts/site/FastChartsScene/.nojekyll
          git archive --format=zip --output=artifacts/source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: browser-site
          path: artifacts/site/FastChartsScene
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: artifacts/source.zip
