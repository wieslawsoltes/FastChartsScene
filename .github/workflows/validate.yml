name: Validate
on:
  push:
    branches: [main, feat/uno-charting]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build portable packages
        run: |
          dotnet build src/FastChartsScene.Core -c Release
          dotnet build src/FastChartsScene.Data -c Release
          dotnet build src/FastChartsScene.SignalProcessing -c Release
      - name: Run contract tests
        if: ${{ hashFiles('tests/FastChartsScene.Tests/Program.cs') != '' }}
        run: dotnet run --project tests/FastChartsScene.Tests -c Release
