name: Validate
on:
  push:
    branches: [main, feat/uno-charting]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build and test portable packages
        run: |
          set -euo pipefail
          mkdir -p artifacts
          dotnet run --project tests/FastChartsScene.Tests -c Release | tee artifacts/core-tests.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-results
          path: artifacts/core-tests.txt
  uno:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Preserve exact source revision
        run: |
          mkdir -p artifacts
          git archive --format=zip --output=artifacts/source.zip HEAD
          git rev-parse HEAD HEAD^{tree} > artifacts/source-revision.txt
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install WebAssembly workload
        run: dotnet workload install wasm-tools
      - name: Compile desktop target
        run: dotnet build samples/FastChartsScene.Explorer -c Release -f net10.0-desktop | tee artifacts/desktop-build.txt
      - name: Publish browser application
        run: dotnet publish samples/FastChartsScene.Explorer -c Release -f net10.0-browserwasm -o artifacts/publish | tee artifacts/browser-build.txt
      - name: Locate browser bundle
        run: |
          set -euo pipefail
          index=$(find artifacts/publish -name index.html -not -path '*/_framework/*' | head -1)
          test -n "$index"
          mkdir -p artifacts/site/FastChartsScene
          cp -a "$(dirname "$index")/." artifacts/site/FastChartsScene/
          touch artifacts/site/FastChartsScene/.nojekyll
      - name: Pack reusable libraries
        run: |
          mkdir -p artifacts/packages
          for project in src/*/*.csproj; do
            dotnet pack "$project" -c Release -o artifacts/packages
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        working-directory: tests/browser
        run: |
          npm install --ignore-scripts --no-audit --no-fund --no-package-lock
          npx playwright install --with-deps chromium
      - name: Validate actual browser application
        working-directory: tests/browser
        run: node browser-tests.mjs | tee ../../artifacts/browser-tests.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-evidence
          path: |
            artifacts/*-build.txt
            artifacts/browser-tests.txt
            artifacts/browser-results
            artifacts/source-revision.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source
          path: artifacts/source.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packages
          path: artifacts/packages
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-site
          path: artifacts/site/FastChartsScene
          include-hidden-files: true
